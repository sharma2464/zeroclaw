<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroClaw Control UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .chat-height { height: calc(100vh - 200px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [messages, setMessages] = useState([
                { role: 'assistant', content: 'Welcome to ZeroClaw. How can I help you today?' }
            ]);
            const [input, setInput] = useState('');
            const [status, setStatus] = useState('loading');
            const [paired, setPaired] = useState(false);
            const [pairingCode, setPairingCode] = useState('');
            const [token, setToken] = useState(localStorage.getItem('zeroclaw_token') || '');
            const messagesEndRef = useRef(null);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            };

            useEffect(() => {
                scrollToBottom();
            }, [messages]);

            useEffect(() => {
                checkHealth();
                const interval = setInterval(checkHealth, 10000);
                return () => clearInterval(interval);
            }, []);

            const checkHealth = async () => {
                try {
                    const res = await fetch('/health');
                    const data = await res.json();
                    setStatus(data.status);
                    setPaired(data.paired);
                } catch (e) {
                    setStatus('offline');
                }
            };

            const handlePair = async () => {
                try {
                    const res = await fetch('/pair', {
                        method: 'POST',
                        headers: { 'X-Pairing-Code': pairingCode }
                    });
                    const data = await res.json();
                    if (data.token) {
                        setToken(data.token);
                        localStorage.setItem('zeroclaw_token', data.token);
                        setPaired(true);
                        alert('Successfully paired!');
                    } else {
                        alert('Invalid pairing code');
                    }
                } catch (e) {
                    alert('Pairing failed');
                }
            };

            const handleSend = async (e) => {
                e.preventDefault();
                if (!input.trim()) return;

                const userMsg = { role: 'user', content: input };
                setMessages(prev => [...prev, userMsg]);
                setInput('');

                try {
                    const res = await fetch('/webhook', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ message: input })
                    });
                    
                    if (res.status === 401) {
                        setPaired(false);
                        setMessages(prev => [...prev, { role: 'assistant', content: '⚠️ Unauthorized. Please pair again.' }]);
                        return;
                    }

                    const data = await res.json();
                    setMessages(prev => [...prev, { role: 'assistant', content: data.response }]);
                } catch (e) {
                    setMessages(prev => [...prev, { role: 'assistant', content: '❌ Error: Could not connect to backend.' }]);
                }
            };

            return (
                <div class="max-w-4xl mx-auto min-h-screen flex flex-col p-4 md:p-8">
                    <header class="flex justify-between items-center mb-8 border-b pb-4">
                        <div class="flex items-center gap-3">
                            <span class="text-3xl">🦀</span>
                            <h1 class="text-2xl font-bold tracking-tight">ZeroClaw <span class="text-slate-400 font-normal text-lg">Control UI</span></h1>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="flex items-center gap-2">
                                <div class={`w-3 h-3 rounded-full ${status === 'ok' ? 'bg-emerald-500' : 'bg-red-500 animate-pulse'}`}></div>
                                <span class="text-sm font-semibold uppercase tracking-wider text-slate-500">{status}</span>
                            </div>
                            {!paired && (
                                <div class="flex gap-2">
                                    <input 
                                        type="text" 
                                        placeholder="Pairing Code" 
                                        class="border rounded px-2 py-1 text-sm mono"
                                        value={pairingCode}
                                        onChange={e => setPairingCode(e.target.value)}
                                    />
                                    <button onClick={handlePair} class="bg-indigo-600 text-white px-3 py-1 rounded text-sm font-semibold hover:bg-indigo-700 transition">Pair</button>
                                </div>
                            )}
                        </div>
                    </header>

                    <main class="flex-grow bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden flex flex-col">
                        <div class="flex-grow overflow-y-auto p-6 space-y-6 chat-height hide-scrollbar">
                            {messages.map((msg, i) => (
                                <div key={i} class={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                    <div class={`max-w-[80%] rounded-2xl px-4 py-3 ${
                                        msg.role === 'user' 
                                            ? 'bg-indigo-600 text-white rounded-tr-none' 
                                            : 'bg-slate-100 text-slate-800 rounded-tl-none border border-slate-200'
                                    }`}>
                                        <div class="text-sm font-bold mb-1 opacity-50 uppercase tracking-tighter">
                                            {msg.role === 'user' ? 'You' : 'ZeroClaw'}
                                        </div>
                                        <div class="whitespace-pre-wrap leading-relaxed">{msg.content}</div>
                                    </div>
                                </div>
                            ))}
                            <div ref={messagesEndRef} />
                        </div>

                        <div class="p-4 bg-slate-50 border-t border-slate-200">
                            <form onSubmit={handleSend} class="flex gap-3">
                                <input 
                                    type="text" 
                                    placeholder="Type a message or command..." 
                                    class="flex-grow border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition bg-white shadow-sm"
                                    value={input}
                                    onChange={e => setInput(e.target.value)}
                                />
                                <button type="submit" class="bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-indigo-700 transition shadow-lg shadow-indigo-200">Send</button>
                            </form>
                        </div>
                    </main>

                    <footer class="mt-6 text-center text-slate-400 text-xs font-medium">
                        ZeroClaw v0.1.0 • Built for Termux • Zero Overhead AI
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
